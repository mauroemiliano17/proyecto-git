<!-- 
Comandos para un nuevo repositorio
git init -> para iniciar git en nuestro repositorio
git add . -> guarda los cambios en git
git commit -m "comentario" -> agrega comentarios significativos
git branch -m main -> cambiamos el nombre de la rama principal de master a main
git remote add origin https://github.com/maudevx/proyecto-git.git -> relaciona la carpeta local con la carpeta de github
git push -u origin main -> envia los cambios guardados a github como respaldo
-->
